# AURIX TC2xx (1G). Flash protection and status are the FLASH0 module, not a DMU. UCBs
# are 1 KiB; the BMHDs are in PFLASH. tcprog does not write or erase TC2xx flash.
# Family defaults: a chip file names this file with base = "tc2xx" and may override any
# key. [memory] is the base map: a chip inherits its ranges, replaces one by giving a
# range of the same name, and removes one with `name = false`.

# A part's id_value is matched under id_mask: SCU_CHIPID CHID[15:12] and CHTEC, so
# any variant, step or microcode version of the series is recognised.
family = "tc2xx"
id_addr = 0xF0036140
id_mask = 0x0000F0C0
bsl_load = 0xC0000000
asclin_flags = 0xF0000634
asclin_flagsclear = 0xF000063C
asclin_txdata = 0xF0000644
asclin_rxdata = 0xF0000648
wdt_cpu0con0 = 0xF0036100
wdt_safcon0 = 0xF00360F0
procondbg = 0xF8002058

[memory]
pflash0 = { kind = "pflash", base = 0xA0000000, size = 0x400000 }
dflash0 = { kind = "dflash", base = 0xAF000000, size = 0x60000 }
# UCB block, 1G stride 0x400.
ucb0    = { kind = "ucb",    base = 0xAF100000, size = 0x4000, erase_protected = true }
# DF1, used by the HSM
dflash1 = { kind = "dflash", base = 0xAF110000, size = 0x10000 }
# CPU0 PSPR at its local address (as CPU0 sees it); BSL loads stage 1 here
pspr0   = { kind = "pspr",   base = 0xC0000000, size = 0x6000 }
# CPU0 DSPR at its local address (as CPU0 sees it); payload stack and CSA
dspr0   = { kind = "dspr",   base = 0xD0000000, size = 0x1C000 }
